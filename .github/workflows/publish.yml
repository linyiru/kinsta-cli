name: Publish Package

# Publishes to npm on a v* tag via npm Trusted Publishing (OIDC) — no NPM_TOKEN
# secret is needed and provenance is attached automatically.
#
# NOTE: do NOT add `registry-url` to setup-node. It writes
# `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` with a placeholder
# token to .npmrc, which makes npm assume classic token auth and skip OIDC
# entirely (npm/documentation#1960). npm defaults to the public registry, and
# OIDC needs only `id-token: write` + a configured trusted publisher.
#
# Trusted publisher config (one-time):
#   npmjs.com -> kinsta-cli -> Settings -> Trusted Publisher -> GitHub Actions
#   (org/user: linyiru, repo: kinsta-cli, workflow: publish.yml)

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false # never use caching in release builds

      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
      - run: npm publish # Or: npm stage publish
