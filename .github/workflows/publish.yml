name: Publish Package

# Publishes to npm on a v* tag via npm Trusted Publishing (OIDC) — no NPM_TOKEN
# secret is needed and provenance is attached automatically. Configure the
# trusted publisher once at:
#   npmjs.com -> kinsta-cli -> Settings -> Trusted Publisher -> GitHub Actions
#   (org/user: linyiru, repo: kinsta-cli, workflow: publish.yml)

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      # Trusted Publishing (OIDC) requires npm >= 11.5.1, newer than the version
      # bundled with Node 24.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
      - run: npm publish # Or: npm stage publish
