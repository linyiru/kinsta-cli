name: Publish to npm

# Publishes to npm when a GitHub Release is published. Authentication uses npm
# Trusted Publishing (OIDC) — no NPM_TOKEN secret is required. Configure the
# trusted publisher for this package once at:
#   npmjs.com -> kinsta-cli -> Settings -> Trusted Publisher -> GitHub Actions
#   (org/user: linyiru, repo: kinsta-cli, workflow: publish.yml)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs npm >= 11.5.1, newer than the version
      # bundled with the runner.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify (format, lint, typecheck, test)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish
